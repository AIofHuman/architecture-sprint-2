version: '3.7'

services:
  # Config Server (stores metadata about the cluster)
  configSvr:
    image: mongo:latest
    container_name: configSrv
    restart: always
    volumes:
      - configsvr_data:/data/configdb
    ports:
      - "27017:27017"
    networks:
      - mongo-cluster
    command: --configsvr --replSet configrs --bind_ip_all --port 27017
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      start_period: 10s

  # Shard 1
  shard1:
    image: mongo:latest
    container_name: shard1
    restart: always
    depends_on:
      - configSvr
    volumes:
      - shard1_data:/data/db
    ports:
      - "27018:27018"
    networks:
      - mongo-cluster
    command: --shardsvr --replSet shard1 --bind_ip_all --port 27018
    # healthcheck:
    #   test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
    #   interval: 5s
    #   start_period: 10s

    # Shard 2
  shard2:
    image: mongo:latest
    container_name: shard2
    restart: always
    depends_on:
      - configSvr
    volumes:
      - shard2_data:/data/db
    ports:
      - "27019:27019"
    networks:
      - mongo-cluster
    command: mongod --shardsvr --replSet shard2 --bind_ip_all --port 27019
    # healthcheck:
    #   test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping').ok" ]
    #   interval: 5s
    #   start_period: 10s

    # Mongos Router (routes queries to the appropriate shard)
  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27020:27020"
    depends_on:
      - configSvr
      - shard1
      - shard2
    networks:
      - mongo-cluster
    command: mongos --configdb configrs/configsvr:27017 --bind_ip_all --port 27020
    healthcheck:
      test: [ "CMD", "pgrep", "mongos" ]
      interval: 5s
      start_period: 10s

  # API application
  pymongo_api:
    container_name: pymongo_api
    restart: always
    build:
      context: api_app
      dockerfile: Dockerfile
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos:27020"
      MONGODB_DATABASE_NAME: "somedb"
    networks:
      - mongo-cluster

volumes:
  configsvr_data:
  shard1_data:
  shard2_data:


networks:
  mongo-cluster:
    driver: bridge
